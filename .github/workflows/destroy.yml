name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the stack name (KafkaEc2Stack) to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: kafka-ec2-stack
  cancel-in-progress: false

env:
  STACK_NAME: KafkaEc2Stack
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check confirmation
        if: inputs.confirm != env.STACK_NAME
        run: |
          echo "Confirmation did not match $STACK_NAME"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: kafka-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy
        run: bash scripts/destroy.sh "$STACK_NAME"
